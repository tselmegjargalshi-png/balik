<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mavi Deniz QR Kodları</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Kaushan+Script&family=Nunito+Sans:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.page{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.page h1{font-size:34px}
.grid{display:grid;gap:22px;margin-top:20px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.q{background:#fff;border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.q img{width:100%;border-radius:18px;display:block}
.q h3{margin:14px 6px 4px;font-size:22px}
.q p{margin:0 6px 14px;color:var(--muted)}
.q .btn{width:100%}
</style>
</head>
<body>
<div class="page">
  <div class="script" style="color:var(--orange);font-size:24px">Mavi Deniz Balık Restoranı</div>
  <h1>Menü QR kodları</h1>
  <p style="color:var(--muted)">Masalara, kapıya veya vitrine yerleştirmek için indirin ve yazdırın. İkisi de aynı menüye gider.</p>
  <div class="grid">
    <div class="q">
      <img src="qr/mavi_deniz_qr_1_dalga.png" alt="Dalga QR kodu">
      <h3>1. Dalga</h3><p>Gün batımı ve dalgalar. Masa kartı ve vitrin için.</p>
      <a class="btn navy" download href="qr/mavi_deniz_qr_1_dalga.png">⬇️ İndir</a>
    </div>
    <div class="q">
      <img src="qr/mavi_deniz_qr_2_gunbatimi.png" alt="Gün batımı QR kodu">
      <h3>2. Gün batımı</h3><p>Lacivert gece ve turuncu güneş. Menü kapağı ve afiş için.</p>
      <a class="btn navy" download href="qr/mavi_deniz_qr_2_gunbatimi.png">⬇️ İndir</a>
    </div>
  </div>
</div>
</body>
</html>
